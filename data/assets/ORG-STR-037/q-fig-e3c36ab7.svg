<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="currentColor">
  <!-- (a) 正方形 -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <polygon points="100,38 172,110 100,182 28,110" stroke-dasharray="5,4" opacity="0.5"/>
    <line x1="100" y1="100" x2="100" y2="46"/><line x1="110" y1="110" x2="162" y2="110"/>
    <line x1="100" y1="120" x2="100" y2="174"/><line x1="90" y1="110" x2="38" y2="110"/>
  </g>
  <text x="100" y="115" text-anchor="middle">C</text>
  <text x="100" y="34" text-anchor="middle">H</text><text x="180" y="115" text-anchor="start">H</text>
  <text x="100" y="198" text-anchor="middle">H</text><text x="20" y="115" text-anchor="end">H</text>
  <text x="100" y="228" text-anchor="middle">(a)</text>
  <!-- (b) 正四面体 -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <g stroke-dasharray="5,4" opacity="0.5">
      <line x1="305" y1="40" x2="250" y2="168"/><line x1="305" y1="40" x2="362" y2="168"/><line x1="305" y1="40" x2="332" y2="122"/>
      <line x1="250" y1="168" x2="362" y2="168"/><line x1="250" y1="168" x2="332" y2="122"/><line x1="362" y1="168" x2="332" y2="122"/>
    </g>
    <line x1="305" y1="118" x2="305" y2="48"/><line x1="298" y1="132" x2="256" y2="163"/>
    <line x1="314" y1="132" x2="355" y2="163"/><line x1="314" y1="122" x2="336" y2="118"/>
  </g>
  <text x="305" y="132" text-anchor="middle">C</text>
  <text x="305" y="34" text-anchor="middle">H</text><text x="244" y="184" text-anchor="middle">H</text>
  <text x="368" y="184" text-anchor="middle">H</text><text x="352" y="112" text-anchor="start">H</text>
  <text x="305" y="228" text-anchor="middle">(b)</text>
  <!-- (c) 四角錐 -->
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <g stroke-dasharray="5,4" opacity="0.5">
      <polygon points="448,170 552,170 590,128 486,128"/>
    </g>
    <line x1="510" y1="46" x2="452" y2="164"/><line x1="514" y1="46" x2="550" y2="164"/>
    <line x1="516" y1="44" x2="584" y2="126"/><line x1="510" y1="46" x2="488" y2="124" stroke-dasharray="3,3"/>
  </g>
  <text x="512" y="38" text-anchor="middle">C</text>
  <text x="442" y="186" text-anchor="middle">H</text><text x="558" y="186" text-anchor="middle">H</text>
  <text x="600" y="132" text-anchor="start">H</text><text x="478" y="124" text-anchor="end">H</text>
  <text x="515" y="228" text-anchor="middle">(c)</text>
</svg>
