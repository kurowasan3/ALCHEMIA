      <rect x="70" y="40" width="130" height="40" rx="5"/>
      <rect x="460" y="40" width="130" height="40" rx="5"/>
      <rect x="70" y="200" width="130" height="40" rx="5"/>
      <rect x="265" y="200" width="130" height="40" rx="5"/>
