      <line x1="135" y1="82" x2="135" y2="196"/>
      <line x1="202" y1="220" x2="261" y2="220"/>
      <line x1="397" y1="220" x2="456" y2="220"/>
      <line x1="525" y1="198" x2="525" y2="84"/>
