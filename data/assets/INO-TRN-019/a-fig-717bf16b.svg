    <text x="135" y="65">Cr<tspan baseline-shift="sub" font-size="10">2</tspan>O<tspan baseline-shift="sub" font-size="10">7</tspan><tspan baseline-shift="super" font-size="10">2−</tspan>（橙赤）</text>
    <text x="525" y="65">CrO<tspan baseline-shift="sub" font-size="10">4</tspan><tspan baseline-shift="super" font-size="10">2−</tspan>（黄）</text>
    <text x="135" y="225">Cr<tspan baseline-shift="super" font-size="10">3+</tspan>（緑）</text>
    <text x="330" y="225">Cr(OH)<tspan baseline-shift="sub" font-size="10">3</tspan>（灰緑）</text>
    <text x="525" y="225">[Cr(OH)<tspan baseline-shift="sub" font-size="10">4</tspan>]<tspan baseline-shift="super" font-size="10">−</tspan>（緑）</text>
