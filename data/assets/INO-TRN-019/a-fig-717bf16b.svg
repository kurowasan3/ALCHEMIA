    <text x="30" y="226" font-size="14">+3</text>
    <text x="30" y="36" font-size="12">酸化数</text>
    <line x1="50" y1="160" x2="620" y2="160" stroke="currentColor" stroke-dasharray="4 4" opacity="0.5"/>
