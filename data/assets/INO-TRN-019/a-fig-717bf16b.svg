    <text x="150" y="112" font-size="13" text-anchor="start" fill="#c0392b">H<tspan baseline-shift="sub" font-size="9">2</tspan>O<tspan baseline-shift="sub" font-size="9">2</tspan>（酸性）</text>
    <text x="150" y="130" font-size="13" text-anchor="start" fill="#c0392b">＝還元剤</text>
    <text x="510" y="112" font-size="13" text-anchor="end" fill="#1f5fbf">H<tspan baseline-shift="sub" font-size="9">2</tspan>O<tspan baseline-shift="sub" font-size="9">2</tspan>（塩基性）</text>
    <text x="510" y="130" font-size="13" text-anchor="end" fill="#1f5fbf">＝酸化剤</text>
