<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="none" stroke="currentColor">
  <!-- power supply -->
  <line x1="120" y1="40" x2="190" y2="40" stroke-width="1.5"/>
  <line x1="190" y1="28" x2="190" y2="52" stroke-width="2"/>
  <line x1="200" y1="33" x2="200" y2="47" stroke-width="4"/>
  <line x1="200" y1="40" x2="300" y2="40" stroke-width="1.5"/>
  <text x="195" y="20" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">直流電源</text>
  <text x="178" y="34" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">+</text>
  <text x="214" y="34" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">−</text>
  <!-- wires down -->
  <line x1="120" y1="40" x2="120" y2="110" stroke-width="1.5"/>
  <line x1="300" y1="40" x2="300" y2="110" stroke-width="1.5"/>
  <!-- electrodes -->
  <rect x="113" y="110" width="14" height="110" stroke-width="1.5"/>
  <rect x="293" y="110" width="14" height="110" stroke-width="1.5"/>
  <!-- tank -->
  <polyline points="60,90 60,250 360,250 360,90" stroke-width="2"/>
  <!-- liquid surface -->
  <line x1="60" y1="125" x2="360" y2="125" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- membrane -->
  <line x1="210" y1="80" x2="210" y2="250" stroke-width="2" stroke-dasharray="7 4" stroke="#1f5fbf"/>
  <text x="210" y="72" text-anchor="middle" fill="#1f5fbf" stroke="none" font-size="13">陽イオン交換膜</text>
  <!-- labels -->
  <text x="120" y="272" text-anchor="middle" fill="currentColor" stroke="none">陽極（Pt）</text>
  <text x="300" y="272" text-anchor="middle" fill="currentColor" stroke="none">陰極（Pt）</text>
  <text x="140" y="292" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">陽極室：NaOH 水溶液</text>
  <text x="290" y="292" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">陰極室：定着廃液</text>
  <text x="165" y="180" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">OH<tspan baseline-shift="super" font-size="10">−</tspan></text>
  <text x="251" y="190" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">[Ag(S<tspan baseline-shift="sub" font-size="10">2</tspan>O<tspan baseline-shift="sub" font-size="10">3</tspan>)<tspan baseline-shift="sub" font-size="10">2</tspan>]<tspan baseline-shift="super" font-size="10">3−</tspan></text>
</svg>
