<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="Noto Sans CJK JP, sans-serif" font-size="14">
  <!-- bath A -->
  <rect x="40" y="70" width="190" height="150" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="135" y="240" text-anchor="middle" fill="currentColor">恒温槽 37 ℃（310 K）</text>
  <!-- bath B -->
  <rect x="320" y="110" width="150" height="110" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="395" y="240" text-anchor="middle" fill="currentColor">恒温槽 27 ℃（300 K）</text>
  <!-- bulb A -->
  <circle cx="135" cy="140" r="62" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="135" y="136" text-anchor="middle" fill="currentColor" font-size="16">A</text>
  <text x="135" y="158" text-anchor="middle" fill="currentColor">2.00 L</text>
  <!-- bulb B -->
  <circle cx="395" cy="165" r="36" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="395" y="162" text-anchor="middle" fill="currentColor" font-size="16">B</text>
  <text x="395" y="181" text-anchor="middle" fill="currentColor">0.50 L</text>
  <!-- tube: up from A top, across, down to B top -->
  <path d="M129 79 L129 30 L389 30 L389 130" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M141 79 L141 42 L401 42 L401 130" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- cock -->
  <circle cx="265" cy="36" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="265" y1="24" x2="265" y2="48" stroke="currentColor" stroke-width="2"/>
  <text x="265" y="16" text-anchor="middle" fill="currentColor">コック</text>
</svg>
