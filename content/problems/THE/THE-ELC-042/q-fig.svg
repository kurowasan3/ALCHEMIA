  <text x="294" y="20" fill="currentColor" stroke="none" font-size="13">−</text>
  <polyline points="272,40 75,40 75,130" stroke-width="1.5"/>
  <polyline points="289,40 485,40 485,130" stroke-width="1.5"/>
