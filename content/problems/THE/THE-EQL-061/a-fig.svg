<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="Noto Sans CJK JP, sans-serif" fill="currentColor">
  <!-- axis: r from 0 to 2.6 ; x = 40 + r*220 -->
  <line x1="40" y1="110" x2="610" y2="110" stroke="currentColor" stroke-width="2"/>
  <polygon points="610,104 622,110 610,116" fill="currentColor"/>
  <text x="600" y="145" font-size="14" text-anchor="middle">r</text>
  <text x="320" y="190" font-size="14" text-anchor="middle">r = p(CO<tspan baseline-shift="sub" font-size="10">2</tspan>) / p(CO)</text>
  <!-- ticks -->
  <line x1="40" y1="102" x2="40" y2="118" stroke="currentColor" stroke-width="2"/>
  <text x="40" y="138" font-size="14" text-anchor="middle">0</text>
  <line x1="150" y1="40" x2="150" y2="125" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="142" font-size="14" text-anchor="middle" fill="#c0392b">K<tspan baseline-shift="sub" font-size="10">2</tspan> = 0.50</text>
  <line x1="370" y1="40" x2="370" y2="125" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="370" y="142" font-size="14" text-anchor="middle" fill="#c0392b">K<tspan baseline-shift="sub" font-size="10">1</tspan> = 1.5</text>
  <!-- region labels -->
  <text x="95" y="60" font-size="16" text-anchor="middle">Fe が安定</text>
  <text x="260" y="60" font-size="16" text-anchor="middle">FeO が安定</text>
  <text x="490" y="60" font-size="16" text-anchor="middle">Fe<tspan baseline-shift="sub" font-size="10">3</tspan>O<tspan baseline-shift="sub" font-size="10">4</tspan> が安定</text>
  <!-- sample points a(0.667) b(0.333) c(2.333) -->
  <circle cx="186.7" cy="110" r="5" fill="#1f5fbf"/>
  <text x="186.7" y="94" font-size="14" text-anchor="middle" fill="#1f5fbf">(a)</text>
  <circle cx="113.3" cy="110" r="5" fill="#1f5fbf"/>
  <text x="113.3" y="94" font-size="14" text-anchor="middle" fill="#1f5fbf">(b)</text>
  <circle cx="553.3" cy="110" r="5" fill="#1f5fbf"/>
  <text x="553.3" y="94" font-size="14" text-anchor="middle" fill="#1f5fbf">(c)</text>
  <text x="40" y="24" font-size="13" opacity="0.8">CO が多い（還元的）←</text>
  <text x="610" y="24" font-size="13" text-anchor="end" opacity="0.8">→ CO₂ が多い（酸化的）</text>
</svg>
