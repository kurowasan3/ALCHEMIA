  <text x="135" y="200" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">Na<tspan baseline-shift="sub" font-size="10">2</tspan>SO<tspan baseline-shift="sub" font-size="10">4</tspan> aq</text>
  <text x="420" y="200" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">Na<tspan baseline-shift="sub" font-size="10">2</tspan>SO<tspan baseline-shift="sub" font-size="10">4</tspan> aq</text>
  <text x="280" y="180" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">CH<tspan baseline-shift="sub" font-size="10">3</tspan>COOH</text>
  <text x="280" y="200" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">＋</text>
  <text x="280" y="220" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">CH<tspan baseline-shift="sub" font-size="10">3</tspan>COONa</text>
  <text x="75" y="270" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">陽極</text>
  <text x="485" y="270" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">陰極</text>
