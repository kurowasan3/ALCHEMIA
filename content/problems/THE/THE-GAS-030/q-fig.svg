<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <g fill="none" stroke="currentColor" stroke-width="2" font-family="Noto Sans CJK JP, sans-serif">
    <!-- 容器I（定積） -->
    <rect x="40" y="150" width="130" height="90" rx="6"/>
    <!-- 連結管とコック -->
    <line x1="170" y1="190" x2="290" y2="190"/>
    <line x1="170" y1="200" x2="290" y2="200"/>
    <circle cx="230" cy="195" r="11" fill="none"/>
    <line x1="230" y1="182" x2="230" y2="208"/>
    <!-- 容器II（シリンダー） -->
    <line x1="290" y1="20" x2="290" y2="190"/>
