<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="none" stroke="currentColor" stroke-width="1.6">
  <!-- external circuit -->
  <polyline points="110,95 110,30 310,30 310,95"/>
  <circle cx="210" cy="30" r="13" fill="none"/>
  <text x="210" y="35" text-anchor="middle" fill="currentColor" stroke="none">V</text>
  <!-- beakers -->
  <path d="M50,90 L50,215 Q50,225 60,225 L170,225 Q180,225 180,215 L180,90"/>
  <path d="M240,90 L240,215 Q240,225 250,225 L360,225 Q370,225 370,215 L370,90"/>
