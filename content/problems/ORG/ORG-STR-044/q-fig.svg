<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 210" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="currentColor">
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <!-- 左端の H（紙面内） -->
    <line x1="112" y1="94" x2="76" y2="60"/><line x1="112" y1="106" x2="76" y2="140"/>
    <!-- C=C=C -->
    <line x1="130" y1="96" x2="206" y2="96"/><line x1="130" y1="104" x2="206" y2="104"/>
    <line x1="234" y1="96" x2="310" y2="96"/><line x1="234" y1="104" x2="310" y2="104"/>
    <!-- 右端の H：くさび（手前）と破線（奥） -->
    <line x1="334" y1="96" x2="372" y2="66" stroke-dasharray="3,3"/>
  </g>
  <polygon points="334,103 372,136 366,141" fill="currentColor"/>
  <text x="120" y="105" text-anchor="middle">C</text><text x="220" y="105" text-anchor="middle">C</text><text x="322" y="105" text-anchor="middle">C</text>
  <text x="68" y="58" text-anchor="middle">H</text><text x="68" y="154" text-anchor="middle">H</text>
  <text x="382" y="64" text-anchor="start">H</text><text x="380" y="152" text-anchor="start">H</text>
  <g font-size="13">
    <text x="90" y="190" text-anchor="middle">H−C−H は紙面内</text>
    <text x="370" y="190" text-anchor="middle">H−C−H は紙面に垂直</text>
    <text x="370" y="24" text-anchor="middle">（くさび：手前，破線：奥）</text>
  </g>
</svg>
