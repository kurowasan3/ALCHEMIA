    <text x="410" y="107">ピストン</text>
    <text x="410" y="50" font-size="13">外圧（一定）</text>
    <text x="410" y="68" font-size="13">1.0×10<tspan baseline-shift="super" font-size="10">5</tspan> Pa</text>
    <text x="210" y="230">コック</text>
  </g>
