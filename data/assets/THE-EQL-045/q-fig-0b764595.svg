  <text x="210" y="80" text-anchor="middle" fill="currentColor" stroke="none" font-size="13">塩橋</text>
  <text x="115" y="245" text-anchor="middle" fill="currentColor" stroke="none">A</text>
  <text x="305" y="245" text-anchor="middle" fill="currentColor" stroke="none">B</text>
